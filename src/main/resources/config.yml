# ── Player Trails — WorldGuard Region Filtering ──────────────────────
#
# Controls where Player Trails are allowed to display.
# This setting ONLY affects Player Trails (not elytra, swim, or arrow trails).
#
# region-mode:
#   WHITELIST — Player trails are ONLY shown inside the listed regions.
#               Outside those regions, no player trail particles play.
#   BLACKLIST — Player trails are BLOCKED inside the listed regions.
#               Everywhere else, they play normally.
#
# regions:
#   A list of WorldGuard region IDs. Case-sensitive.
#   If this list is empty, the region-mode is ignored and trails always play.
#   If WorldGuard is not installed, this entire section is ignored.

player-trails:
  region-mode: WHITELIST
  regions: []
  # regions:
  #   - spawn
  #   - lobby
  #   - arena_1

# ── Arrow Trails ─────────────────────────────────────────────────────
#
# delay:
#   Number of ticks to wait before projectile trail particles begin spawning.
#   During the first ticks of flight, no particles will spawn (default: 5 ticks = 0.25s).
#
# max-lifetime:
#   Maximum lifetime of an arrow trail in ticks before it stops and unregisters.
#   Default: 1200 ticks (1 minute). Set to 0 to disable.
#   Supports tick numbers (e.g. 1200) or duration strings (e.g. "1m", "60s").
#
arrow-trails:
  delay: 5
  max-lifetime: 1200

# ── Vanish Compatibility ──────────────────────────────────────────────
#
# When enabled, trails will respect Paper's Vanish API.
# Hidden/vanished players' trails will NOT be seen by players who cannot see them.
# The vanished players and server staff who can see them will still see the trails.
respect-vanish: true

# ── Skin Change Settings ─────────────────────────────────────────────
#
# Cost to change skin using the GUI button.
# Set to 0 to make it free.
skin-change:
  cost: 100.0
  discount:
    # Enable VIP discount lookups via LimitAPI (falls back to LuckPerms meta).
    enabled: true
    # LuckPerms meta key — also passed to LimitAPI when installed.
    key: "skin-discount"
    # LimitAPI strategy: META, PERMISSION_HIGHEST, or PERMISSION_SUMMED
    strategy: "META"
    # Discount percent when no meta/permission value is found (0 = no discount).
    default-percent: 0
    # Shown in the discounted price lore line (e.g. "20% discount from VIP").
    source: "VIP"

# ── Custom Hat Settings ──────────────────────────────────────────────
#
# Cost to equip a custom hat using the GUI button.
# Set to 0 to make it free.
custom-hat:
  cost: 50.0
  discount:
    # Enable VIP discount lookups via LimitAPI (falls back to LuckPerms meta).
    enabled: true
    # LuckPerms meta key — also passed to LimitAPI when installed.
    key: "hat-discount"
    # LimitAPI strategy: META, PERMISSION_HIGHEST, or PERMISSION_SUMMED
    strategy: "META"
    # Discount percent when no meta/permission value is found (0 = no discount).
    default-percent: 0
    # Shown in the discounted price lore line (e.g. "20% discount from VIP").
    source: "VIP"

# ── Command Settings ────────────────────────────────────────────────
#
# Customize the main command name, aliases, and subcommand names/aliases.
# Note: Any changes here require a server restart or plugin reload.
#
command:
  name: "elytra"
  aliases:
    - "elytratrails"
    - "et"
    - "cosmetics"
  subcommands:
    gui:
      name: "gui"
      aliases: []
    elytra:
      name: "elytra"
      aliases: []
    player:
      name: "player"
      aliases: []
    swim:
      name: "swim"
      aliases: []
    arrow:
      name: "arrow"
      aliases: []
    reload:
      name: "reload"
      aliases: []
    give:
      name: "give"
      aliases: []

